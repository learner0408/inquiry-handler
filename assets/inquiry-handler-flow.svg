<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="title desc">
  <title id="title">Inquiry Handler — WhatsApp RAG and Google Docs ingestion flow</title>
  <desc id="desc">WhatsApp messages pass through signature verification, deduplication, history, semantic cache, hybrid HNSW and BM25 retrieval, RRF, reranking, Claude generation, persistence, and reply. Summarization runs after replies. A separate ingestion lane loads Google Docs into Postgres for both retrievers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#C78416"/>
    </marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172033}.panel{fill:#fff;stroke:#DFE6EE;stroke-width:1.5}.section{font-size:19px;font-weight:700;letter-spacing:.7px}.box{stroke-width:2}.bt{font-size:18px;font-weight:700;text-anchor:middle}.bx{font-size:14px;fill:#46536A;text-anchor:middle}.note{font-size:14px;fill:#5B667A}.channel{fill:#E8F8EF;stroke:#22A865}.orch{fill:#EAF2FF;stroke:#4285D7}.retrieval{fill:#F2EDFF;stroke:#8264D7}.llm{fill:#FFF4DB;stroke:#D99A22}.ingest{fill:#E7F8F6;stroke:#159A92}.storage{fill:#F1F5F9;stroke:#64748B}.fallback{fill:#FFF1F2;stroke:#D9586A;stroke-dasharray:6 4}.flow{fill:none;stroke:#64748B;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.async{fill:none;stroke:#C78416;stroke-width:2.2;stroke-dasharray:8 6;stroke-linecap:round;marker-end:url(#arrowAmber)}.step{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}.legend{font-size:13px;fill:#46536A}
    </style>
  </defs>
  <rect width="1800" height="1400" fill="#F8FAFC"/>
  <text x="60" y="52" font-size="34" font-weight="750">Inquiry Handler — end-to-end flow</text>
  <text x="60" y="82" font-size="16" fill="#5B667A">Live WhatsApp answers + independent Google Docs ingestion · numbered steps follow a cache MISS</text>
  <circle cx="1120" cy="48" r="7" fill="#22A865"/><text x="1134" y="53" class="legend">Channel</text>
  <circle cx="1245" cy="48" r="7" fill="#4285D7"/><text x="1259" y="53" class="legend">Orchestration</text>
  <circle cx="1415" cy="48" r="7" fill="#8264D7"/><text x="1429" y="53" class="legend">Retrieval</text>
  <circle cx="1550" cy="48" r="7" fill="#D99A22"/><text x="1564" y="53" class="legend">LLM</text>
  <circle cx="1120" cy="77" r="7" fill="#159A92"/><text x="1134" y="82" class="legend">Ingestion</text>
  <circle cx="1245" cy="77" r="7" fill="#64748B"/><text x="1259" y="82" class="legend">Storage</text>
  <text x="1415" y="82" class="legend">Dashed amber = post-reply work</text>

  <rect x="40" y="120" width="1720" height="940" rx="22" class="panel"/>
  <text x="70" y="158" class="section" fill="#326FAE">A · LIVE WHATSAPP INQUIRY</text>

  <g><rect x="70" y="190" width="160" height="86" rx="14" class="box channel"/><circle cx="88" cy="208" r="11" fill="#22A865"/><text x="88" y="208" class="step">1</text><text x="150" y="224" class="bt">WhatsApp user</text><text x="150" y="250" class="bx">sends a question</text></g>
  <path d="M230 233H290" class="flow"/>
  <g><rect x="290" y="190" width="190" height="86" rx="14" class="box channel"/><circle cx="308" cy="208" r="11" fill="#22A865"/><text x="308" y="208" class="step">2</text><text x="385" y="224" class="bt">Meta Cloud API</text><text x="385" y="250" class="bx">signed webhook POST</text></g>
  <path d="M480 233H550" class="flow"/>
  <g><rect x="550" y="190" width="240" height="86" rx="14" class="box orch"/><circle cx="568" cy="208" r="11" fill="#4285D7"/><text x="568" y="208" class="step">3</text><text x="670" y="222" class="bt">FastAPI webhook</text><text x="670" y="246" class="bx">verify HMAC · ACK 200</text><text x="670" y="266" class="bx">statuses ignored</text></g>
  <path d="M790 233H870" class="flow"/>
  <g><rect x="870" y="190" width="270" height="86" rx="14" class="box orch"/><circle cx="888" cy="208" r="11" fill="#4285D7"/><text x="888" y="208" class="step">4</text><text x="1005" y="222" class="bt">Dedupe + load history</text><text x="1005" y="246" class="bx">external_id · running summary</text><text x="1005" y="266" class="bx">+ last 20 raw messages</text></g>
  <path d="M1140 233H1220" class="flow"/>
  <g><rect x="1220" y="190" width="230" height="86" rx="14" class="box orch"/><circle cx="1238" cy="208" r="11" fill="#4285D7"/><text x="1238" y="208" class="step">5</text><text x="1335" y="222" class="bt">Semantic cache</text><text x="1335" y="246" class="bx">exact hash → vector match</text><text x="1335" y="266" class="bx">revision freshness check</text></g>
  <path d="M1450 233H1510" class="flow"/>
  <g><rect x="1510" y="190" width="220" height="86" rx="14" class="box channel"/><text x="1620" y="224" class="bt">Cache HIT</text><text x="1620" y="250" class="bx">save turn + cached answer</text></g>

  <path d="M1335 276V320H345V365" class="flow"/>
  <path d="M1335 276V320H995V365" class="flow"/>
  <text x="1350" y="311" font-size="14" font-weight="700" fill="#8264D7">MISS</text>
  <text x="70" y="345" class="section" fill="#7050BC">6 · HYBRID RETRIEVAL</text>
  <g><rect x="230" y="365" width="230" height="84" rx="14" class="box retrieval"/><text x="345" y="401" class="bt">Embed question</text><text x="345" y="427" class="bx">NVIDIA · query mode</text></g>
  <path d="M460 407H540" class="flow"/>
  <g><rect x="540" y="365" width="250" height="84" rx="14" class="box retrieval"/><text x="665" y="397" class="bt">HNSW dense retrieval</text><text x="665" y="422" class="bx">pgvector cosine · top K</text><text x="665" y="441" class="bx">reads ingested chunks</text></g>
  <g><rect x="870" y="365" width="250" height="84" rx="14" class="box retrieval"/><text x="995" y="397" class="bt">BM25 lexical retrieval</text><text x="995" y="422" class="bx">Postgres FTS + GIN · top K</text><text x="995" y="441" class="bx">reads ingested chunks</text></g>

  <path d="M665 449V475H775V520" class="flow"/>
  <path d="M995 449V475H775V520" class="flow"/>
  <g><rect x="665" y="520" width="220" height="100" rx="14" class="box retrieval"/><circle cx="683" cy="538" r="11" fill="#8264D7"/><text x="683" y="538" class="step">7</text><text x="775" y="557" class="bt">RRF fusion</text><text x="775" y="586" class="bx">rank-based · k = 60</text></g>
  <path d="M885 570H1010" class="flow"/>
  <g><rect x="1010" y="520" width="250" height="100" rx="14" class="box retrieval"/><circle cx="1028" cy="538" r="11" fill="#8264D7"/><text x="1028" y="538" class="step">8</text><text x="1135" y="557" class="bt">Nemotron reranker</text><text x="1135" y="586" class="bx">select best Top N chunks</text></g>
  <path d="M1260 570H1350" class="flow"/>
  <g><rect x="1350" y="520" width="340" height="100" rx="14" class="box llm"/><circle cx="1368" cy="538" r="11" fill="#D99A22"/><text x="1368" y="538" class="step">9</text><text x="1520" y="554" class="bt">Claude grounded answer</text><text x="1520" y="580" class="bx">history + question + reranked chunks</text><text x="1520" y="602" class="bx">inline [doc_id] citations</text></g>
  <g><rect x="665" y="665" width="595" height="60" rx="12" class="box fallback"/><text x="962" y="690" class="bx">Fallback: no usable context → “not in docs”</text><text x="962" y="712" class="bx">saved to history · never cached</text></g>

  <path d="M1520 620V690" class="flow"/>
  <g><rect x="1350" y="690" width="340" height="90" rx="14" class="box storage"/><circle cx="1368" cy="708" r="11" fill="#64748B"/><text x="1368" y="708" class="step">10</text><text x="1520" y="727" class="bt">Persist result</text><text x="1520" y="752" class="bx">cache: grounded answers only</text><text x="1520" y="772" class="bx">history: every visible answer</text></g>
  <path d="M1520 780V850" class="flow"/>
  <g><rect x="1350" y="850" width="340" height="80" rx="14" class="box channel"/><circle cx="1368" cy="868" r="11" fill="#22A865"/><text x="1368" y="868" class="step">11</text><text x="1520" y="882" class="bt">Meta Cloud API</text><text x="1520" y="908" class="bx">send WhatsApp reply</text></g>
  <path d="M1520 930V970" class="flow"/>
  <g><rect x="1350" y="970" width="340" height="70" rx="14" class="box channel"/><circle cx="1368" cy="988" r="11" fill="#22A865"/><text x="1368" y="988" class="step">12</text><text x="1520" y="1017" class="bt">User receives the answer</text></g>

  <path d="M1620 276V310H1735V890H1690" class="flow"/>
  <text x="1712" y="580" class="note" transform="rotate(-90 1712 580)">cached answer skips retrieval + generation</text>
  <g><rect x="870" y="835" width="340" height="130" rx="14" class="box llm" stroke-dasharray="8 5"/><text x="1040" y="870" class="bt">Post-reply maintenance</text><text x="1040" y="898" class="bx">LLM title once per thread</text><text x="1040" y="922" class="bx">summary per 20 expired messages</text><text x="1040" y="946" class="bx">summary helps the next inquiry</text></g>
  <path d="M1350 890H1210" class="async"/>
  <text x="70" y="1025" class="note">Cache HIT: save + return immediately · Cache MISS: retrieve → rerank → generate · Summaries are not rebuilt per message</text>

  <rect x="40" y="1100" width="1720" height="250" rx="22" class="panel"/>
  <text x="70" y="1138" class="section" fill="#117E78">B · INDEPENDENT GOOGLE DOCS INGESTION</text>
  <g><rect x="70" y="1180" width="230" height="100" rx="14" class="box ingest"/><text x="185" y="1217" class="bt">Allowlisted Google Docs</text><text x="185" y="1246" class="bx">versioned source of truth</text></g>
  <path d="M300 1230H380" class="flow"/>
  <g><rect x="380" y="1180" width="250" height="100" rx="14" class="box ingest"/><text x="505" y="1217" class="bt">Fetch + chunk</text><text x="505" y="1246" class="bx">revision hash · 700 / 100</text></g>
  <path d="M630 1230H720" class="flow"/>
  <g><rect x="720" y="1180" width="250" height="100" rx="14" class="box ingest"/><text x="845" y="1217" class="bt">Embed passages</text><text x="845" y="1246" class="bx">NVIDIA · 2048 dimensions</text></g>
  <path d="M970 1230H1070" class="flow"/>
  <g><rect x="1070" y="1180" width="250" height="100" rx="14" class="box ingest"/><text x="1195" y="1210" class="bt">Atomic per-doc replace</text><text x="1195" y="1238" class="bx">remove old revision</text><text x="1195" y="1260" class="bx">insert new chunks</text></g>
  <path d="M1320 1230H1410" class="flow"/>
  <g><rect x="1410" y="1180" width="300" height="100" rx="14" class="box storage"/><text x="1560" y="1210" class="bt">Postgres + pgvector</text><text x="1560" y="1238" class="bx">chunks · HNSW · generated FTS</text><text x="1560" y="1260" class="bx">shared by both retrievers above</text></g>
  <text x="70" y="1320" class="note">Runs independently of live inquiries · re-ingest on revision change · stale cache entries fail the revision freshness check</text>
</svg>
