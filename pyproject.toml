[project]
name = "inquiry-handler"
version = "0.1.0"
description = "Inquiry Bot: channel adapters -> RAG over Google Docs -> LLM answer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "alembic>=1.13",
  "httpx>=0.27",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "openai>=1.0",
  "langchain>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-openai>=0.2",
  "langchain-postgres>=0.0.12",
  "langchain-nvidia-ai-endpoints>=0.3",
  "langgraph>=0.2",
  "tiktoken>=0.7",
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
  "deepeval>=1.0",
  "langchain-anthropic>=1.7.6",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
